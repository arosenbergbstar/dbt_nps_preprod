name: "dbt_nps"
version: "1.0.0"
config-version: 2

# This setting configures which "profile" dbt uses for this project.
profile: "dbt_nps"

# These configurations specify where dbt should look for different types of files.
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target" # directory which will store compiled SQL files
clean-targets: # directories to be removed by `dbt clean`
    - "target"
    - "dbt_packages"

flags:
    send_anonymous_usage_stats: false

data_tests:
    +severity: warn # all tests

# Configuring models
# Full documentation: https://docs.getdbt.com/docs/configuring-models
# These settings can be overridden in individual model files
# using the `{{ config(...) }}` macro.
models:
    dbt_nps:
        +meta:
            dbt-osmosis: "docs/_{model}.yml"
        +grants:
            select: ["TRANSFORMER", "TRANSFORMER_DEV", "SVC_METAPLANE_ROLE"]
        +persist_docs:
            relation: true
            columns: true
        labvantage:
            +schema: labvantage
            +materialized: table
            +tags:
                - "hourly"
                - "validated"
            intermediate:
                +schema: labvantage_intermediate
                +materialized: ephemeral
            staging:
                +schema: labvantage_stage
                +materialized: view
            entities:
                +schema: labvantage_entity
                +materialized: table
            features:
                +schema: labvantage_feature
                +materialized: table
        pipeline:
            +schema: pipeline
            +materialized: table
            +tags:
                - "hourly"
            int:
                +schema: pipeline_int
                +materialized: ephemeral
            entities:
                +schema: pipeline_entity
                +materialized: table
            features:
                +schema: pipeline_features
                +materialized: table
        reports:
            +schema: reports
            +grants:
                +select: ["REPORTER"]
            +materialized: table
            +tags:
                - "hourly"
        export:
            +database: export
