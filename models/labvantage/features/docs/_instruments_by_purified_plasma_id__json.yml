version: 2
models:
  - name: instruments_by_purified_plasma_id__json
    description: >
      Instruments used on a purified plasma, as a single JSON object. One row per purified
      plasma ID. Anchor: samples (purified_plasma_id).
    columns:
      - name: purified_plasma_id
        data_type: VARCHAR
        data_tests:
          - unique
          - not_null
        description: Purified plasma tube label (samples.purified_plasma_id). Primary key.
      - name: instruments
        data_type: OBJECT
        description: >
          Object keyed by '<array_method_id> <instrument_type_id>'. The value is the instrument ID
          when one was used, or an ordered array of instrument IDs when several were.
