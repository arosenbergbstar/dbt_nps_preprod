version: 2
models:
  - name: reagent_lots_by_purified_plasma_id__flat
    description: >
      Manufacturer lot numbers of reagents used on a purified plasma, one column per reagent
      type. One row per purified plasma ID. Anchor: samples (purified_plasma_id). Where more
      than one lot of a reagent type was used, the max lot is kept.
    columns:
      - name: purified_plasma_id
        data_type: VARCHAR
        data_tests:
          - unique
          - not_null
        description: Purified plasma tube label (samples.purified_plasma_id). Primary key.
      - name: te_buffer_lot_number
        data_type: VARCHAR
        description: Manufacturer lot of 'TE Buffer (1X)' (max if more than one).
      - name: molecular_grade_h2o_lot_number
        data_type: VARCHAR
        description: Manufacturer lot of 'Molecular Grade H2O' (max if more than one).
      - name: ethanol_lot_number
        data_type: VARCHAR
        description: Manufacturer lot of 'Ethanol (100%)' (max if more than one).
      - name: ampure_xp_beads_lot_number
        data_type: VARCHAR
        description: Manufacturer lot of 'AMPure XP Beads' (max if more than one).
      - name: quant_it_picogreen_dsdna_reagent_lot_number
        data_type: VARCHAR
        description: Manufacturer lot of 'Quant-iT PicoGreen dsDNA Reagent' (max if more than one).
      - name: eb_buffer_lot_number
        data_type: VARCHAR
        description: Manufacturer lot of 'EB Buffer' (max if more than one).
      - name: phix_control_lot_number
        data_type: VARCHAR
        description: Manufacturer lot of 'PhiX Control' (max if more than one).
      - name: novaseq_6000_buffer_cartridge_lot_number
        data_type: VARCHAR
        description: Manufacturer lot of 'NovaSeq 6000 Buffer Cartridge' (max if more than one).
      - name: novaseq_6000_sbs_cartridge_lot_number
        data_type: VARCHAR
