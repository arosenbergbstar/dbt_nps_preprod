version: 2
models:
  - name: timestamps_by_purified_plasma_id__tall
    description: >
      Lab milestone timestamps per purified plasma, unpivoted. One row per purified plasma ID
      per request per milestone that has occurred (null timestamps are dropped). Anchor:
      samples (purified_plasma_id).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - purified_plasma_id
              - request_id
              - event_name
    columns:
      - name: purified_plasma_id
        data_type: VARCHAR
        description: Purified plasma tube label. Null for requests with only whole blood or plasma samples. Part of composite primary key.
      - name: request_id
        data_type: VARCHAR
        description: LabVantage test request ID. Part of composite primary key.
      - name: event_name
        data_type: VARCHAR
        data_tests:
          - not_null
        description: Milestone name, the matching timestamps_by_purified_plasma_id__flat column without the _at suffix (e.g., received, cfdna_extraction). Part of composite primary key.
      - name: event_at
        data_type: TIMESTAMP_TZ
        description: Timestamp of the milestone, truncated to the second.
