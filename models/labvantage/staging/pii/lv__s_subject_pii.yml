models:
  - name: lv__s_subject_pii
    description:
      The lv__s_subject_pii model is a collection of patient information
      captured in LabVantage.
    columns:
      - name: SUBJECT_ID
        description: The unique identifier for the subject. This is a VARCHAR field.
        data_type: VARCHAR
      - name: SEX_AT_BIRTH
        description:
          The sex of the subject at birth. This is a VARCHAR field and can
          contain values like 'Male', 'Female', etc.
        data_type: VARCHAR
        meta:
          masking_policy: mp_encrypt_pii_string
      - name: HAS_INFORMED_CONSENT
        description:
          A boolean field indicating whether the subject has given informed
          consent for the study or not. True indicates consent has been given,
          while False indicates otherwise.
        data_type: BOOLEAN
      - name: DIABETES_DIAGNOSED_DATE
        description:
          The timestamp at which the subject was diagnosed with diabetes. The
          data type is DATE.
        data_type: DATE
        meta:
          masking_policy: mp_encrypt_pii_date
      - name: AGE_AT_BLOOD_DRAW
        description:
          The age of the subject at the time of blood draw. The data type is
          NUMBER.
        data_type: NUMBER
        meta:
          masking_policy: mp_encrypt_pii_number
      - name: CLIENT_ID
        description: The unique identifier for the client. The data type is VARCHAR.
        data_type: VARCHAR
      - name: ORDERING_PHYSICIAN_NAME
        description: The name of the physician who ordered the lab test. This is
          typically the patient's primary care physician or a specialist who is
          treating the patient.
        data_type: VARCHAR
      - name: BODY_MASS_INDEX
        description:
          A measure of body fat based on height and weight that applies to
          adult men and women. It is used as a screening tool to identify
          possible weight problems in adults.
        data_type: FLOAT
        meta:
          masking_policy: mp_encrypt_pii_number
      - name: IPMN
        description:
          This column represents the presence or absence of Intraductal
          Papillary Mucinous Neoplasm (IPMN) in the patient. It is a type of
          pancreatic cyst that can lead to pancreatic cancer.
        data_type: BOOLEAN
        meta:
          masking_policy: mp_encrypt_pii_bool
      - name: SMOKER
        description:
          This column indicates whether the patient is a smoker or not. It is
          a significant risk factor for various diseases, including pancreatic
          cancer.
        data_type: VARCHAR
        meta:
          masking_policy: mp_encrypt_pii_string
      - name: IS_HEAVY_SMOKER
        description:
          A boolean field indicating whether the subject is a heavy smoker.
          True if the subject is a heavy smoker, false otherwise.
        data_type: BOOLEAN
        meta:
          masking_policy: mp_encrypt_pii_bool
      - name: ETHNICITY
        description:
          This column represents the ethnicity of the patient. It is used for
          demographic analysis and to study the prevalence of diseases among
          different ethnic groups.
        data_type: VARCHAR
        meta:
          masking_policy: mp_encrypt_pii_string
      - name: ETHNICITY_OTHER
        description:
          This column contains additional information about the patient's
          ethnicity if the standard options in the 'ETHNICITY' column do not
          apply. It is a VARCHAR type and can contain any string of text.
        data_type: VARCHAR
        meta:
          masking_policy: mp_encrypt_pii_string
      - name: ICD_10_CODE
        description:
          This column contains the ICD-10 code associated with the patient's
          diagnosis. ICD-10 is a medical classification list by the World Health
          Organization (WHO) that contains codes for diseases, signs and
          symptoms, abnormal findings, and external causes of injuries or
          diseases. It is a VARCHAR type and can contain any string of text.
        data_type: VARCHAR
        meta:
          masking_policy: mp_encrypt_pii_string
      - name: ICD_10_CODE_OTHER
        description:
          This column contains additional ICD-10 codes if the patient has
          more than one diagnosis. It is a VARCHAR type and can contain any
          string of text.
        data_type: VARCHAR
        meta:
          masking_policy: mp_encrypt_pii_string
      - name: HAS_CHRONIC_PANCREATITIS
        description:
          A boolean field indicating whether the subject has been diagnosed
          with chronic pancreatitis. True if the subject has chronic
          pancreatitis, false otherwise.
        data_type: BOOLEAN
        meta:
          masking_policy: mp_encrypt_pii_bool
      - name: HAS_FAMILY_HISTORY_OF_PANCREATIC_CANCER
        description:
          A boolean field indicating whether the subject has a family history
          of pancreatic cancer. True if there is a family history of pancreatic
          cancer, false otherwise.
        data_type: BOOLEAN
        meta:
          masking_policy: mp_encrypt_pii_bool
      - name: HAS_RISK_FACTORS
        description:
          A boolean field indicating whether the subject has any known risk
          factors for the condition being tested. True indicates the presence of
          risk factors, while False indicates their absence.
        data_type: BOOLEAN
        meta:
          masking_policy: mp_encrypt_pii_bool
      - name: KNOWN_GENETIC_RISK_FACTORS
        description:
          This column contains information about any known genetic risk
          factors that the patient may have. The data is stored as a VARCHAR
          type.
        data_type: VARCHAR
        meta:
          masking_policy: mp_encrypt_pii_string
      - name: OTHER_CLINICAL_INFO
        description:
          This column contains any other clinical information that may be
          relevant to the patient's case. This could include notes from the
          physician, additional diagnoses, etc. The data is stored as a VARCHAR
          type.
        data_type: VARCHAR
        meta:
          masking_policy: mp_encrypt_pii_string
      - name: PATIENT_MEDICAL_RECORD_NUMBER
        description: The unique identifier for the patient's medical record.
        data_type: VARCHAR
        meta:
          masking_policy: mp_encrypt_pii_string
      - name: PATIENT_DESCRIPTION
        description: A brief description or note about the patient.
        data_type: VARCHAR
        meta:
          masking_policy: mp_encrypt_pii_string
      - name: PATIENT_FIRST_NAME
        description:
          The first name of the patient. This is a VARCHAR field and can
          contain any alphanumeric characters.
        data_type: VARCHAR
        meta:
          masking_policy: mp_encrypt_pii_string
      - name: PATIENT_MIDDLE_NAME
        description:
          The middle name of the patient. This is a VARCHAR field and can
          contain any alphanumeric characters.
        data_type: VARCHAR
        meta:
          masking_policy: mp_encrypt_pii_string
      - name: PATIENT_LAST_NAME
        description:
          The last name of the patient. This is a VARCHAR field and can
          contain any alphanumeric characters.
        data_type: VARCHAR
        meta:
          masking_policy: mp_encrypt_pii_string
      - name: PATIENT_EMAIL
        description:
          The email address of the patient. This is a VARCHAR field and
          should contain a valid email address.
        data_type: VARCHAR
        meta:
          masking_policy: mp_encrypt_pii_string
      - name: PATIENT_PHONE_NUMBER
        description:
          The phone number of the patient. This is a VARCHAR field and can
          contain any valid phone number format.
        data_type: VARCHAR
        meta:
          masking_policy: mp_encrypt_pii_string
      - name: PATIENT_ADDRESS_STREET
        description:
          The street address of the patient. This is a VARCHAR field and can
          contain any valid street address.
        data_type: VARCHAR
        meta:
          masking_policy: mp_encrypt_pii_string
      - name: PATIENT_ADDRESS_CITY
        description:
          The city of the patient's address. This is a VARCHAR field and can
          contain any valid city name.
        data_type: VARCHAR
        meta:
          masking_policy: mp_encrypt_pii_string
      - name: PATIENT_ADDRESS_STATE
        description:
          The state in which the patient resides. This is a text field and
          can contain any valid state name or abbreviation.
        data_type: VARCHAR
        meta:
          masking_policy: mp_encrypt_pii_string
      - name: PATIENT_ADDRESS_ZIP_CODE
        description:
          The zip code of the patient's address. This is a text field and can
          contain any valid zip code.
        data_type: VARCHAR
        meta:
          masking_policy: mp_encrypt_pii_string
      - name: PATIENT_BIRTH_DATE
        description:
          The birth date of the patient. This is a timestamp field and should
          contain a valid date in the format YYYY-MM-DD.
        data_type: DATE
        meta:
          masking_policy: mp_encrypt_pii_date
      - name: PATIENT_DEATH_DATE
        description:
          The date when the patient passed away. This is represented in the
          DATE format.
        data_type: DATE
        meta:
          masking_policy: mp_encrypt_pii_date
      - name: SUBJECT_TYPE
        description:
          The type of the subject. This is a VARCHAR field and can contain
          various types of subjects.
        data_type: VARCHAR
      - name: NOTES
        description:
          Any additional notes or comments related to the subject. This is a
          VARCHAR field and can contain any text.
        data_type: VARCHAR
      - name: USER_SEQUENCE
        description: Not sure what this is for.
        data_type: NUMBER
      - name: AUDIT_SEQUENCE
        description:
          This column represents the sequence number assigned to the record
          in the audit history. It indicates how many times the record has been
          modified.
        data_type: NUMBER
      - name: IS_FROM_TEMPLATE
        description: This column indicates whether the record was created from a
          template. It is a boolean value where 'true' means the record was
          created from a template and 'false' means it was not.
        data_type: BOOLEAN
      - name: IS_ACTIVE
        description: Not sure what this is.
        data_type: BOOLEAN
      - name: TRACE_LOG_ID
        description: Not sure what this is.
        data_type: VARCHAR
      - name: MODIFIED_BY
        description:
          The identifier of the user who last modified the subject's record.
          This could be a username or a system-generated user ID.
        data_type: VARCHAR
      - name: MODIFIED_AT
        description: The timestamp when the record was last modified. This is
          automatically updated by the system whenever a change is made to the
          record.
        data_type: TIMESTAMP_TZ
      - name: CREATED_BY
        description: The identifier of the user who created the record. This is
          automatically populated by the system at the time of record creation.
        data_type: VARCHAR
      - name: CREATED_AT
        description:
          The timestamp when the record was created. This is automatically
          populated by the system at the time of record creation.
        data_type: TIMESTAMP_TZ
      - name: ELT_EMITTED_AT
        description: This column represents the timestamp at which the data was
          extracted from the source system. It is of type TIMESTAMPTZ and is
          automatically generated by the data ingestion tool.
        data_type: TIMESTAMP_TZ
      - name: ELT_HASH_ID
        description:
          This column represents a unique hash identifier for each record. It
          is of type VARCHAR and is automatically generated by the data
          ingestion tool.
        data_type: VARCHAR
