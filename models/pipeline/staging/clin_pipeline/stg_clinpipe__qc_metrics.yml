version: 2

models:
  - name: stg_clinpipe__qc_metrics
    description: >
      Staging model for QC metrics, unions v1 and v2 pipeline data.
      Includes pipeline_name for internal debugging/testing.

      QC metrics are extracted as columns upstream in v1/v2 staging models.
      This model passes through standardized columns with consistent naming.
    columns:
      - name: job_id
        description: Unique identifier for the pipeline job
        tests:
          - not_null
          - unique

      - name: pipeline_name
        description: Name of the pipeline (ovarian, pancreatic, multicancer, pancv2)
        tests:
          - not_null

      - name: hmc_zero_cpg_fraction
        description: >
          Fraction of HMC fragments with zero CpG sites.
          Value should be between 0 and 1, or NULL for failed samples.
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
                inclusive: true

      - name: hmc_zero_cpg_count
        description: >
          Raw count of HMC fragments with zero CpG sites (v1 pipelines only).
          v2 pipelines return NULL for this field.

      - name: hmc_qc_json_raw
        description: >
          Raw JSON blob containing HMC QC metrics from source.
          Preserved for downstream ad-hoc querying.

      - name: wgs_qc_json_raw
        description: >
          Raw JSON blob containing WGS QC metrics from source (v1 pipelines only).
          v2 pipelines return NULL for this field.
